<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fonts are same-origin (see scripts/fetch-fonts.js), so there is no
         third-party handshake left to preconnect and no <link> here at all:
         @font-face lives in the bundled stylesheet.

         Deliberately *not* preloaded. Preloading the two hero faces was
         measured on an emulated Slow 4G phone and made things worse — 146KB of
         font pulled bandwidth away from the render-blocking stylesheet, which
         went 528ms -> 713ms and pushed FCP from ~1200ms to ~1306ms, while LCP
         did not move at all. `font-display: swap` already paints the text in a
         fallback face immediately, so the fonts are not on the critical path
         and should not be promoted onto it. -->

    <meta
      name="description"
      content="Software Engineer with 4 years modernizing core banking systems — Axis2/Java 8 to Spring Boot 3 across ~4,600 classes, 50+ APIs migrated, test coverage from 20% to 85%. Based in Uruguay, UTC−3, full US Eastern overlap."
    />
    <meta name="author" content="Felipe Fontana" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://ffontana.dev/en" />

    <meta property="og:type" content="profile" />
    <meta property="og:url" content="https://ffontana.dev/en" />
    <meta
      property="og:title"
      content="Felipe Fontana — Software Engineer, Java & Spring Boot"
    />
    <meta
      property="og:description"
      content="I migrate legacy banking systems to Spring Boot without breaking the contracts customers depend on. Uruguay, UTC−3."
    />
    <!-- Generated from scripts/og-template.html by `pnpm og`. Regenerate after
         editing the template; do not hand-edit public/og-image.jpg. -->
    <meta property="og:image" content="https://ffontana.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Felipe Fontana — Software Engineer. Java, Spring Boot, legacy modernization. Uruguay, UTC−3."
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_UY" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta property="og:locale:alternate" content="zh_CN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Felipe Fontana — Software Engineer, Java & Spring Boot"
    />
    <meta
      name="twitter:description"
      content="Legacy banking modernization: Axis2 → Spring Boot 3, contract-verified. Uruguay, UTC−3."
    />
    <meta name="twitter:image" content="https://ffontana.dev/og-image.jpg" />

    <!-- §8: /en is canonical and x-default — the thesis is the US market. -->
    <link rel="alternate" hreflang="en" href="https://ffontana.dev/en" />
    <link rel="alternate" hreflang="es" href="https://ffontana.dev/es" />
    <link rel="alternate" hreflang="pt" href="https://ffontana.dev/pt" />
    <link rel="alternate" hreflang="zh" href="https://ffontana.dev/zh" />
    <link rel="alternate" hreflang="x-default" href="https://ffontana.dev/en" />

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Felipe Fontana — Software Engineer | Java, Spring Boot, Legacy Modernization</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

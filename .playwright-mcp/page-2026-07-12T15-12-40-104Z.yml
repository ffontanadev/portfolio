            - paragraph [ref=e491]: // The spec is the test suite
            - heading "Schemathesis + OpenAPI" [level=3] [ref=e492]
            - paragraph [ref=e493]: Schemathesis reads a service's OpenAPI schema and generates property-based tests — hundreds of boundary, malformed and stateful cases the contract implies but nobody writes by hand. It surfaces schema drift and unexpected 500s before a client ever sees them — exactly what a migrated endpoint has to prove.

          - generic [ref=e458]:
            - paragraph [ref=e459]: // Traverse the graph — don't grep it
            - heading "Project indexing" [level=3] [ref=e460]
            - paragraph [ref=e461]: I index each codebase into a knowledge graph of functions, routes, call chains and service contracts. Agents traverse how the code actually connects instead of grepping or guessing through semantic search — so a sprawling migration surface answers to a query, not a full-text scan.

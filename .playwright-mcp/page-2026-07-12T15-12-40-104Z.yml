        - generic [ref=e429]: § 03 — Method
        - heading "How I work with agents" [level=2] [ref=e432]
        - paragraph [ref=e433]: On codebases too large to hold in one head, an agent is only as sharp as the ground truth you give it. My method keeps AI anchored to real structure and provable contracts — every answer traced through a graph, every endpoint checked against its spec.
      - generic [ref=e434]:

<!DOCTYPE html>
<!--
  Source for public/og-image.jpg — rendered by scripts/og-image-script.js.
  Palette and font-variation-settings are copied from src/index.css so the
  share card reads as the same object as the site. Keep them in sync by hand:
  this file is deliberately standalone (no Tailwind, no build step) so the
  screenshot never depends on the app compiling.

  Content rule: the card says who and what. The scale figures (~4,600 classes,
  50+ APIs) live in the <meta name="description">, which every platform renders
  directly beneath this image — repeating them here reads as inflation.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cream-50: #fff8f3;
        --coral-500: #ff6b6b;
        --teal-500: #00d9a3;
        --purple-500: #9d4edd;
        --dark-900: #1a1a1a;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
      }

      body {
        position: relative;
        overflow: hidden;
        background: var(--cream-50);
        color: var(--dark-900);
        font-family: "Fraunces", serif;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
      }

      /* Ambient blobs — the hero's atmosphere, frozen. */
      .blob {
        position: absolute;
        border-radius: 9999px;
        filter: blur(90px);
        pointer-events: none;
      }
      .blob-coral {
        right: -130px;
        top: -170px;
        width: 460px;
        height: 460px;
        background: rgb(255 107 107 / 0.07);
      }
      .blob-teal {
        left: -190px;
        bottom: -230px;
        width: 480px;
        height: 480px;
        background: rgb(0 217 163 / 0.06);
      }
      .blob-purple {
        right: 4%;
        bottom: -6%;
        width: 300px;
        height: 300px;
        background: rgb(157 78 221 / 0.05);
      }

      .frame {
        position: relative;
        z-index: 1;
        height: 100%;
        padding: 66px 72px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* Top row ------------------------------------------------- */
      .top {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }

      .wordmark {
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -0.04em;
        font-variation-settings: "opsz" 120, "SOFT" 60, "WONK" 1;
      }
      .wordmark .dot {
        color: var(--coral-500);
        font-style: italic;
        font-weight: 300;
      }

      .eyebrow {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 15px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgb(26 26 26 / 0.5);
      }

      /* Middle -------------------------------------------------- */
      .name {
        font-size: 92px;
        font-weight: 700;
        line-height: 1.02;
        letter-spacing: -0.03em;
        font-variation-settings: "opsz" 120, "SOFT" 60, "WONK" 1;
      }

      .role {
        margin-top: 22px;
        font-size: 38px;
        line-height: 1.32;
        letter-spacing: -0.01em;
        color: rgb(26 26 26 / 0.78);
        font-variation-settings: "opsz" 60, "SOFT" 50;
      }
      .role em {
        color: var(--coral-500);
        font-style: italic;
        font-variation-settings: "opsz" 80, "SOFT" 100;
      }

      /* Bottom -------------------------------------------------- */
      .bottom {
        display: flex;
        align-items: center;
        gap: 26px;
      }

      .hairline {
        height: 1px;
        width: 92px;
        background: var(--dark-900);
        opacity: 0.18;
      }

      .availability {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 21px;
        font-weight: 400;
        letter-spacing: 0.02em;
        color: rgb(26 26 26 / 0.62);
      }
    </style>
  </head>
  <body>
    <div class="blob blob-coral"></div>
    <div class="blob blob-teal"></div>
    <div class="blob blob-purple"></div>

    <div class="frame">
      <div class="top">
        <div class="wordmark">FF<span class="dot">.</span></div>
        <div class="eyebrow">ffontana.dev</div>
      </div>

      <div>
        <div class="name">Felipe Fontana</div>
        <!-- Break after the dash on purpose: letting it wrap naturally orphans
             "modernization." onto its own line. -->
        <div class="role">
          Software Engineer —<br />
          <em>Java, Spring Boot, legacy modernization.</em>
        </div>
      </div>

      <div class="bottom">
        <span class="hairline"></span>
        <span class="availability">Uruguay · UTC−3 · full overlap with US Eastern</span>
      </div>
    </div>
  </body>
</html>
